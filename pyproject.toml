[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-efficiency-courses"
version = "0.1.0"
description = "AI Efficiency Courses with Pruna"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "pruna[full]==0.2.10",
    "pruna[gptq]==0.2.10",
    "pruna_pro==0.2.9",
    "matplotlib",
    "jupyter>=1.1.1",
    "notebook>=6.0.0",
    "ipywidgets>=8.1.7",
    "widgetsnbextension",
    "pyarrow<20",
    "fsspec==2023.9.2",
    "ruff>=0.12.7",
    "pre-commit>=3.6.0",
    "plotly>=6.2.0",
    "pymupdf>=1.26.3",
    "ipython[all]>=8.37.0",
    "gradio-pdf>=0.0.22",
    "pdf2image>=1.17.0",
]

[project.scripts]
sync-notebooks = "scripts.sync_notebooks:main"
add-colab-buttons = "scripts.add_colab_buttons:main"

[project.urls]
Repository = "https://github.com/PrunaAI/ai-efficiency-courses"

[tool.setuptools]
packages = ["course", "slides"]
py-modules = ["scripts.sync_notebooks", "scripts.add_colab_buttons"]

[tool.uv]
extra-index-url = [
    "https://prunaai.pythonanywhere.com/",
]
index-strategy = "unsafe-best-match"
prerelease = "allow"
